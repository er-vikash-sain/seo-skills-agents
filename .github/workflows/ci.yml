name: AI OS Evaluation Scorecard & Regression Gate

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  evaluate_scorecard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run Architecture Fitness & Evaluation Scorecard
        run: |
          python3 evals/run_scorecard.py
